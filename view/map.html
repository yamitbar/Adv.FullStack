<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pathly.css">
    <title>Pathly - Map View</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen w-screen flex overflow-hidden">

    <aside class="w-80 bg-white border-r border-gray-200 p-6 flex flex-col h-full z-20">
        <h2 class="text-xl font-bold mb-6">USA Road Trip 2026</h2>
        
        <button id="openModalBtn" class="w-full bg-teal-900 text-white py-3 rounded-lg font-semibold hover:bg-teal-800 transition mb-6">
            + Add New Location
        </button>

        <div class="flex-1 overflow-y-auto space-y-4">
            <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Locations</h3>
            
            <div class="p-3 border rounded-lg hover:bg-gray-50 cursor-pointer">
                <p class="font-medium">Golden Gate Bridge</p>
                <p class="text-xs text-gray-500">Aug 3, 2026</p>
            </div>
            <div class="p-3 border rounded-lg hover:bg-gray-50 cursor-pointer">
                <p class="font-medium">Fisherman's Wharf</p>
                <p class="text-xs text-gray-500">Aug 3, 2026</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 bg-gray-100 relative">
        <div class="absolute inset-0 flex items-center justify-center text-gray-400">
            [Google Maps API Container]
        </div>
    </main>

    <div id="locationModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold mb-4">New Location</h2>
            <form class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Detected Location</label>
                    <input type="text" value="Yosemite National Park" disabled class="w-full p-2 border rounded bg-gray-50">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Title</label>
                    <input type="text" placeholder="Enter title..." class="w-full p-2 border rounded focus:ring-2 focus:ring-teal-600 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Image URL</label>
                    <input type="text" placeholder="Paste image link..." class="w-full p-2 border rounded focus:ring-2 focus:ring-teal-600 outline-none">
                </div>
                
                <div class="flex gap-2 mt-6">
                    <button type="button" id="closeModalBtn" class="w-1/2 py-2 border rounded-lg hover:bg-gray-100">Cancel</button>
                    <button type="submit" class="w-1/2 py-2 bg-teal-900 text-white rounded-lg hover:bg-teal-800">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById('locationModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');

        openBtn.onclick = () => modal.classList.remove('hidden');
        closeBtn.onclick = () => modal.classList.add('hidden');
    </script>
</body>
</html>
