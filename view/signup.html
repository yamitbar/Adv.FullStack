<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pathly.css">
    <title>Pathly - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <div class="flex min-h-screen">
        <div class="w-full lg:w-1/2 flex flex-col justify-center px-12 lg:px-24">
            <h1 class="text-3xl font-bold mb-2">Create your account</h1>
            <p class="text-gray-600 mb-8">Start your journey with Pathly</p>
            
            <form class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-600 outline-none" placeholder="Enter your username">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-600 outline-none" placeholder="Enter your password">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Confirm Password</label>
                    <input type="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-600 outline-none" placeholder="Confirm your password">
                </div>
                <button type="submit" class="w-full bg-teal-900 text-white py-3 rounded-lg font-semibold hover:bg-teal-800 transition">
                    Sign Up
                </button>
            </form>
            <p class="mt-6 text-center text-sm text-gray-500">
                Already have an account? <a href="login.html" class="text-teal-700 font-semibold hover:underline">Log in</a>
            </p>
        </div>

        <div class="hidden lg:block w-1/2 bg-teal-800 flex items-center justify-center text-white p-10">
            <h2 class="text-4xl font-bold italic">Document. Share. Remember.</h2>
        </div>
    </div>
</body>
</html>
