<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pathly.css">
    <title>Pathly - Location Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="max-w-4xl mx-auto p-4">
        <div class="relative w-full h-80 rounded-2xl overflow-hidden shadow-lg mb-6">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=1200" 
                 alt="Location Cover" class="w-full h-full object-cover">
            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-6 text-white">
                <h1 class="text-4xl font-bold">Yosemite National Park</h1>
            </div>
        </div>

        <div class="flex items-center gap-6 text-gray-600 mb-8 px-2">
            <div class="flex items-center gap-2">
                <span class="font-semibold text-teal-900">נוצר על ידי:</span> נועה
            </div>
            <div class="flex items-center gap-2">
                <span class="font-semibold text-teal-900">תאריך:</span> 24 באוגוסט, 2026
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-teal-100 rounded-full flex items-center justify-center font-bold text-teal-900">א</div>
                <div>
                    <h4 class="font-bold">אבא</h4>
                    <p class="text-xs text-gray-500">לפני שעתיים</p>
                </div>
            </div>
            <p class="mb-4">הנוף כאן פשוט עוצר נשימה! מומלץ להגיע מוקדם לפני העומס.</p>
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&q=80&w=800" class="w-full rounded-lg mb-4">
            
            <div class="border-t pt-4">
                <h5 class="text-sm font-semibold mb-2">תגובות</h5>
                <div class="space-y-3">
                    <div class="bg-gray-50 p-3 rounded-lg text-sm">
                        <span class="font-bold text-teal-900">נועה:</span> וואו, איזה יופי!
                    </div>
                </div>
                <input type="text" placeholder="הוסף תגובה..." class="w-full mt-3 p-2 border rounded-lg text-sm focus:ring-2 focus:ring-teal-600 outline-none">
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mt-8">
            <h3 class="font-bold text-lg mb-4">שתפו חוויה חדשה</h3>
            <textarea class="w-full p-3 border rounded-lg mb-3" placeholder="מה אתם רוצים להוסיף?"></textarea>
            <div class="flex gap-2">
                <button class="bg-gray-100 px-4 py-2 rounded-lg hover:bg-gray-200">📷 תמונה</button>
                <button class="bg-teal-900 text-white px-4 py-2 rounded-lg hover:bg-teal-800">פרסם</button>
            </div>
        </div>
    </main>

</body>
</html>
