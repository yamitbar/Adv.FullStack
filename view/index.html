<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pathly.css">
    <title>Pathly - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold text-teal-900">Pathly</div>
        <div class="flex items-center gap-6">
            <a href="#" class="text-gray-600 hover:text-teal-900 font-medium">My Trips</a>
            <a href="#" class="bg-teal-900 text-white px-5 py-2 rounded-lg hover:bg-teal-800 transition">Create New Trip</a>
            <div class="w-10 h-10 bg-teal-100 rounded-full flex items-center justify-center font-bold text-teal-900 cursor-pointer">
                N
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8">
        
        <section class="mb-12">
            <div class="h-96 w-full bg-teal-50 border border-teal-200 rounded-2xl flex flex-col items-center justify-center shadow-sm">
                <p class="text-teal-800 font-medium mb-2">Every place holds a memory</p>
                <h2 class="text-3xl font-bold text-teal-900">Click on the map to start your adventure</h2>
                <button class="mt-4 bg-teal-900 text-white px-6 py-2 rounded-lg shadow-md hover:bg-teal-800 transition">
                    Open Map
                </button>
            </div>
        </section>

        <section>
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl font-bold text-gray-900">My Trips</h2>
                <a href="#" class="text-teal-700 font-semibold hover:underline">View all</a>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                    <div class="h-40 bg-gray-300"></div> <div class="p-4">
                        <h3 class="font-bold text-lg">USA Road Trip 2026</h3>
                        <p class="text-sm text-gray-500">Aug 6 - Aug 27, 2026</p>
                    </div>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                    <div class="h-40 bg-gray-300"></div>
                    <div class="p-4">
                        <h3 class="font-bold text-lg">California Dreaming</h3>
                        <p class="text-sm text-gray-500">May 10 - May 20, 2025</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-gray-200 mt-12 py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2026 Pathly. All rights reserved.</p>
    </footer>

</body>
</html>
